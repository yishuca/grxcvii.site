<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This is a game.</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #08080f;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    width: min(calc(100vw - 16px), calc((100vh - 16px) * 1.8));
    height: auto;
    aspect-ratio: 900 / 500;
    display: block;
    border-radius: 10px;
    box-shadow: 0 0 80px rgba(80,120,255,0.15), 0 0 0 1px rgba(255,255,255,0.06);
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="900" height="500"></canvas></div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function sign(v) { return v < 0 ? -1 : 1; }

  /* ============================================================
     LEVEL GEOMETRY  (one level, forever)
     ============================================================ */
  var FLOOR_Y = 440;
  var CEIL_Y  = 18;
  var BASE_SIZE = 26;
  var DOOR_W = 46;
  var DOOR_H = 64;
  var START_X = 60;
  var DOOR_X  = 828;

  var SOLIDS = [
    { x: 0,   y: 0,   w: 900, h: 18  },  // ceiling
    { x: 0,   y: 440, w: 900, h: 60  },  // floor
    { x: 0,   y: 0,   w: 18,  h: 500 },  // left wall
    { x: 882, y: 0,   w: 18,  h: 500 },  // right wall
    { x: 150, y: 330, w: 150, h: 18  },
    { x: 390, y: 250, w: 150, h: 18  },
    { x: 630, y: 330, w: 150, h: 18  }
  ];

  /* ============================================================
     STAGES — the same level, different rules
     ============================================================ */
  var STAGES = [
    { hint: 'Reach the door.',
      setup: function () {} },

    { hint: "You can't jump.",
      setup: function (f) { f.canJump = false; } },

    { hint: 'Left is right. Right is left.',
      setup: function (f) { f.invertX = true; } },

    { hint: 'Slippery ice.',
      setup: function (f) { f.ice = true; } },

    { hint: "It's dark in here.",
      setup: function (f) { f.darkness = true; } },

    { hint: "You're tiny.",
      setup: function (f) { f.playerScale = 0.5; } },

    { hint: "You're huge.",
      setup: function (f) { f.playerScale = 2.4; } },

    { hint: 'Low gravity.',
      setup: function (f) { f.gravity = 0.22; f.jump = 8.6; } },

    { hint: 'Gravity is upside down.',
      setup: function (f) { f.gravityDir = -1; } },

    { hint: 'The door is shy.',
      setup: function (f) { f.doorFlees = 2.8; } },

    { hint: 'Strong wind. Hold right!',
      setup: function (f) { f.wind = -2.1; } },

    { hint: 'You have 6 seconds.',
      setup: function (f) { f.timeLimit = 6; } },

    { hint: 'Go back to where you started.',
      place: function (p, d) { p.x = 800; d.x = 60; } },

    { hint: 'ZOOM.',
      setup: function (f) { f.speed = 9; f.jump = 14; f.gravity = 0.85; } }
  ];

  /* ============================================================
     INPUT
     ============================================================ */
  var keys = { left: false, right: false, jump: false };
  var jumpBuffer = 0;

  function onKey(down, e) {
    var k = e.key.toLowerCase();
    var handled = true;
    if (k === 'arrowleft' || k === 'a') {
      keys.left = down;
    } else if (k === 'arrowright' || k === 'd') {
      keys.right = down;
    } else if (k === 'arrowup' || k === 'w' || k === ' ') {
      if (down && !keys.jump) jumpBuffer = 8;
      keys.jump = down;
    } else if (k === 'r') {
      if (down && game.won) restart();
    } else {
      handled = false;
    }
    if (handled) e.preventDefault();
  }

  window.addEventListener('keydown', function (e) { onKey(true, e); });
  window.addEventListener('keyup',   function (e) { onKey(false, e); });

  /* ============================================================
     GAME STATE
     ============================================================ */
  var game = {
    stage: 0,
    flags: null,
    player: null,
    door: null,
    solids: SOLIDS,
    spawn: { px: START_X, py: 0, dx: DOOR_X, dy: 0 },
    timeLeft: 0,
    fade: 0,
    won: false,
    message: '',
    messageTimer: 0
  };

  function loadStage(i) {
    game.stage = i;
    var st = STAGES[i];

    var f = {
      canJump: true,
      invertX: false,
      ice: false,
      darkness: false,
      gravity: 0.62,
      gravityDir: 1,
      playerScale: 1,
      speed: 4.6,
      jump: 12.6,
      wind: 0,
      timeLimit: 0,
      doorFlees: 0,
      extraSolids: []
    };
    if (st.setup) st.setup(f);

    game.flags = f;
    game.solids = f.extraSolids.length ? SOLIDS.concat(f.extraSolids) : SOLIDS;

    var size = BASE_SIZE * f.playerScale;
    var p = game.player = {
      x: START_X, y: 0, w: size, h: size, vx: 0, vy: 0, onGround: false
    };
    var d = game.door = {
      x: DOOR_X, y: FLOOR_Y - DOOR_H, w: DOOR_W, h: DOOR_H
    };

    if (f.gravityDir === 1) {
      p.y = FLOOR_Y - size;
    } else {
      p.y = CEIL_Y;
      d.y = CEIL_Y;
    }

    if (st.place) st.place(p, d);

    game.spawn = { px: p.x, py: p.y, dx: d.x, dy: d.y };
    game.timeLeft = f.timeLimit;
    game.fade = 1;
    game.message = '';
    game.messageTimer = 0;
  }

  function respawn() {
    var p = game.player;
    p.x = game.spawn.px;
    p.y = game.spawn.py;
    p.vx = 0;
    p.vy = 0;
    game.door.x = game.spawn.dx;
    game.door.y = game.spawn.dy;
    game.timeLeft = game.flags.timeLimit;
  }

  function restart() {
    game.won = false;
    loadStage(0);
  }

  function nextStage() {
    if (game.stage + 1 >= STAGES.length) {
      game.won = true;
      game.fade = 1;
    } else {
      loadStage(game.stage + 1);
    }
  }

  /* ============================================================
     COLLISION HELPERS
     ============================================================ */
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function moveX(p, dt) {
    p.x += p.vx * dt;
    for (var i = 0; i < game.solids.length; i++) {
      var s = game.solids[i];
      if (!aabb(p, s)) continue;
      if (p.vx > 0) p.x = s.x - p.w;
      else if (p.vx < 0) p.x = s.x + s.w;
      p.vx = 0;
    }
  }

  function moveY(p, dt) {
    p.y += p.vy * dt;
    p.onGround = false;
    for (var i = 0; i < game.solids.length; i++) {
      var s = game.solids[i];
      if (!aabb(p, s)) continue;
      if (p.vy > 0) {
        p.y = s.y - p.h; p.vy = 0; p.onGround = true;
      } else if (p.vy < 0) {
        p.y = s.y + s.h; p.vy = 0; p.onGround = true;
      }
    }
  }

  /* ============================================================
     UPDATE
     ============================================================ */
  function update(dt) {
    game.fade = Math.max(0, game.fade - dt * 0.09);

    if (game.won) return;

    var f = game.flags;
    var p = game.player;

    if (game.messageTimer > 0) game.messageTimer -= dt;
    if (jumpBuffer > 0) jumpBuffer -= dt;

    /* ---- time limit ---- */
    if (f.timeLimit > 0) {
      game.timeLeft -= dt / 60;
      if (game.timeLeft <= 0) {
        respawn();
        game.message = 'Too slow!';
        game.messageTimer = 100;
        return;
      }
    }

    /* ---- horizontal input ---- */
    var dir = 0;
    if (keys.left)  dir -= 1;
    if (keys.right) dir += 1;
    if (f.invertX)  dir = -dir;

    if (f.ice) {
      p.vx += dir * 0.6 * dt;
      p.vx *= Math.pow(0.96, dt);
      p.vx = clamp(p.vx, -7.5, 7.5);
    } else {
      p.vx = dir * f.speed + f.wind;
    }

    /* ---- gravity ---- */
    p.vy += f.gravity * f.gravityDir * dt;
    p.vy = clamp(p.vy, -26, 26);

    /* ---- jump ---- */
    if (jumpBuffer > 0 && p.onGround && f.canJump) {
      p.vy = -f.jump * f.gravityDir;
      p.onGround = false;
      jumpBuffer = 0;
    }

    /* ---- move & collide ---- */
    moveX(p, dt);
    moveY(p, dt);

    /* ---- the shy door ---- */
    if (f.doorFlees > 0) {
      var d = game.door;
      var pc = p.x + p.w / 2;
      var dc = d.x + d.w / 2;
      var dist = dc - pc;
      if (Math.abs(dist) < 330) {
        d.x += sign(dist) * f.doorFlees * dt;
      }
      d.x = clamp(d.x, 22, W - 22 - d.w);
    }

    /* ---- reached the door? ---- */
    if (aabb(p, game.door)) nextStage();
  }

  /* ============================================================
     DRAWING
     ============================================================ */
  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawDoor() {
    var d = game.door;
    var t = performance.now() / 1000;
    var pulse = 0.5 + 0.5 * Math.sin(t * 3);

    ctx.save();
    ctx.shadowColor = 'rgba(74,222,128,0.9)';
    ctx.shadowBlur = 16 + pulse * 12;
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.restore();

    ctx.fillStyle = 'rgba(8,40,20,0.6)';
    ctx.fillRect(d.x + 6, d.y + 6, d.w - 12, d.h - 12);

    ctx.fillStyle = '#eafff2';
    ctx.beginPath();
    ctx.arc(d.x + d.w - 12, d.y + d.h / 2, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    var p = game.player;
    var r = Math.min(p.w, p.h) * 0.28;

    roundRect(ctx, p.x, p.y, p.w, p.h, r);
    ctx.fillStyle = '#ffd166';
    ctx.fill();
    ctx.strokeStyle = '#b8862a';
    ctx.lineWidth = Math.max(1.5, p.w * 0.05);
    ctx.stroke();

    var eyeR = Math.max(1.6, p.w * 0.13);
    var eyeY = p.y + p.h * 0.36;
    var look = clamp(p.vx * 0.7, -3, 3);
    ctx.fillStyle = '#1a1a2a';

    ctx.beginPath();
    ctx.arc(p.x + p.w * 0.34 + look, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x + p.w * 0.66 + look, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDarkness() {
    var p = game.player;
    var cx = p.x + p.w / 2;
    var cy = p.y + p.h / 2;
    var g = ctx.createRadialGradient(cx, cy, 34, cx, cy, 205);
    g.addColorStop(0,    'rgba(0,0,0,0)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.78)');
    g.addColorStop(1,    'rgba(0,0,0,0.97)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawUI() {
    var f = game.flags;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(140,150,200,0.95)';
    ctx.fillText('STAGE ' + (game.stage + 1) + ' / ' + STAGES.length, 34, 470);

    ctx.textAlign = 'center';
    ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
    ctx.fillStyle = '#e9ecff';
    ctx.fillText(STAGES[game.stage].hint, W / 2, 470);

    if (f.timeLimit > 0) {
      var bw = 180, bx = W - 34 - bw, by = 464, bh = 12;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(bx, by, bw, bh);
      var frac = clamp(game.timeLeft / f.timeLimit, 0, 1);
      ctx.fillStyle = frac > 0.35 ? '#4ade80' : '#f87171';
      ctx.fillRect(bx, by, bw * frac, bh);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    }

    if (game.messageTimer > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(248,113,113,' + clamp(game.messageTimer / 40, 0, 1) + ')';
      ctx.fillText(game.message, W / 2, 210);
    }

    ctx.textBaseline = 'alphabetic';
  }

  function drawWin() {
    ctx.fillStyle = 'rgba(8,8,16,0.92)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#4ade80';
    ctx.font = 'bold 52px system-ui, sans-serif';
    ctx.fillText('YOU ESCAPED!', W / 2, H / 2 - 70);

    ctx.fillStyle = '#c9d0ff';
    ctx.font = '20px system-ui, sans-serif';
    ctx.fillText('That was the only level — you beat all ' + STAGES.length + ' versions of it.',
                 W / 2, H / 2 - 8);

    ctx.fillStyle = 'rgba(200,210,255,0.55)';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Press  R  to play again', W / 2, H / 2 + 62);

    ctx.textBaseline = 'alphabetic';
  }

  function render() {
    /* background */
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#171726');
    bg.addColorStop(1, '#0e0e18');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* subtle grid */
    ctx.strokeStyle = 'rgba(120,140,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 50) {
      ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H);
    }
    for (var y = 0; y <= H; y += 50) {
      ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5);
    }
    ctx.stroke();

    /* platforms */
    for (var i = 0; i < game.solids.length; i++) {
      var s = game.solids[i];
      ctx.fillStyle = '#262639';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#3d3d5c';
      ctx.fillRect(s.x, s.y, s.w, 4);
    }

    if (!game.flags.darkness) drawDoor();
    drawPlayer();

    if (game.flags.darkness) {
      drawDarkness();
      drawDoor();          // the door glows through the dark
    }

    drawUI();

    if (game.fade > 0) {
      ctx.fillStyle = 'rgba(8,8,15,' + game.fade + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (game.won) {
      ctx.globalAlpha = 1 - game.fade;
      drawWin();
      ctx.globalAlpha = 1;
    }
  }

  /* ============================================================
     MAIN LOOP
     ============================================================ */
  var last = performance.now();

  function loop(now) {
    var dt = (now - last) / 16.6667;
    last = now;
    if (dt > 3) dt = 3;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  /* ============================================================
     GO
     ============================================================ */
  loadStage(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
