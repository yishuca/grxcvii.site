<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Prism Path — Light Puzzle</title>
<style>
  :root{
    --bg:#070a14;
    --cyan:#3fe0ff;
    --violet:#8b6bff;
    --gold:#ffd166;
    --text:#e9f0ff;
    --muted:#8b9ac0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b2757 0%, transparent 60%),
      radial-gradient(900px 600px at 92% 112%, #2a1550 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh;
    padding:14px;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }

  .app{
    width:100%;
    max-width:620px;
    display:flex; flex-direction:column; gap:12px;
    align-items:center;
  }

  /* ---------- HUD ---------- */
  .hud{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 6px;
    gap:10px;
  }
  .brand{
    font-size:13px; font-weight:800; letter-spacing:.22em;
    color:#cfe4ff;
  }
  .brand span{
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stats{
    display:flex; gap:14px;
    font-size:11px; letter-spacing:.14em; color:var(--muted);
    font-weight:700; font-variant-numeric:tabular-nums;
  }
  .stats b{ color:var(--cyan); font-weight:800; }

  .hint{
    width:100%; padding:0 6px;
    font-size:12px; color:var(--muted); text-align:center;
    letter-spacing:.02em;
    min-height:16px;
  }

  /* ---------- BOARD ---------- */
  .board{
    position:relative;
    width:min(100%, 56vh, 540px);
    width:min(100%, 56dvh, 540px);
    aspect-ratio:1 / 1;
    border-radius:24px;
    background:linear-gradient(160deg, rgba(255,255,255,.055), rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.075);
    box-shadow:
      0 34px 80px -34px rgba(0,0,0,.95),
      0 0 0 1px rgba(63,224,255,.05),
      inset 0 1px 0 rgba(255,255,255,.07);
    padding:10px;
    isolation:isolate;
  }
  .board::before{
    content:"";
    position:absolute; inset:-28%;
    background:radial-gradient(circle at 50% 50%, rgba(63,224,255,.10), transparent 62%);
    z-index:-1; pointer-events:none;
  }

  .board-svg{
    display:block; width:100%; height:100%;
    border-radius:16px;
    overflow:hidden;
    --beam:#3fe0ff;
  }
  .board-svg.solved{ --beam:#6dffb0; }

  /* cells */
  .cell{
    fill:rgba(255,255,255,.028);
    stroke:rgba(255,255,255,.055);
    stroke-width:.015;
  }
  .cell.wall{
    fill:#101830;
    stroke:rgba(120,150,255,.16);
    stroke-width:.02;
  }

  /* mirrors */
  .mirror-bg{
    fill:rgba(127,233,255,.10);
    stroke:rgba(127,233,255,.18);
    stroke-width:.015;
  }
  .mirror-line{
    stroke:#8beeff;
    stroke-width:.115;
    stroke-linecap:round;
    filter:url(#glow);
    transform-box:view-box;
    transition:transform .30s cubic-bezier(.34,1.45,.64,1);
    pointer-events:none;
  }

  /* beam */
  .beam-glow{
    fill:none; stroke:var(--beam); stroke-width:.46;
    stroke-linecap:round; stroke-linejoin:round;
    opacity:.30; filter:url(#softglow);
    pointer-events:none;
  }
  .beam-mid{
    fill:none; stroke:var(--beam); stroke-width:.135;
    stroke-linecap:round; stroke-linejoin:round;
    opacity:.85; filter:url(#glow);
    pointer-events:none;
  }
  .beam-core{
    fill:none; stroke:#ffffff; stroke-width:.055;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:.45 .55;
    animation:flow 1.1s linear infinite;
    opacity:.95; pointer-events:none;
  }
  @keyframes flow{ to{ stroke-dashoffset:-1; } }

  /* target */
  .target-ring{
    fill:none; stroke:var(--gold); stroke-width:.085;
    filter:url(#glow);
    transform-box:fill-box; transform-origin:center;
    animation:pulse 2s ease-in-out infinite;
  }
  .target-dot{
    fill:var(--gold); filter:url(#glow);
  }
  .board-svg.solved .target-ring{ stroke:#6dffb0; }
  .board-svg.solved .target-dot{ fill:#6dffb0; }
  @keyframes pulse{
    0%,100%{ opacity:.5; transform:scale(.9); }
    50%    { opacity:1;  transform:scale(1.08); }
  }

  /* source */
  .source-circle{ fill:url(#srcGrad); filter:url(#glow); }
  .source-arrow{ fill:#04101a; }

  /* hit zones */
  .hit{ fill:transparent; pointer-events:all; cursor:pointer; }

  /* ---------- CONTROLS ---------- */
  .controls{
    display:flex; gap:10px; justify-content:center; width:100%;
  }
  button{
    font:inherit; font-size:14px; font-weight:700;
    color:var(--text);
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.11);
    padding:11px 24px;
    border-radius:14px;
    cursor:pointer;
    transition:background .18s, transform .12s, box-shadow .18s;
    letter-spacing:.01em;
  }
  button:hover{ background:rgba(255,255,255,.12); }
  button:active{ transform:scale(.965); }
  button.primary{
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    color:#04121b;
    border:none;
    box-shadow:0 12px 34px -12px var(--cyan);
  }
  button.primary:hover{ box-shadow:0 16px 40px -12px var(--cyan); }

  /* ---------- OVERLAY ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:rgba(6,9,20,.80);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border-radius:24px;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
    text-align:center;
    padding:20px;
    z-index:5;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .ov-title{
    font-size:clamp(20px,5vw,28px);
    font-weight:800;
    letter-spacing:.01em;
    background:linear-gradient(90deg,var(--cyan),var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .ov-sub{ font-size:14px; color:var(--muted); margin-bottom:6px; }
</style>
</head>
<body>

<div class="app">

  <div class="hud">
    <div class="brand">PRISM<span>PATH</span></div>
    <div class="stats">
      <span>LEVEL <b id="lvl">1</b>/<b id="maxLvl">8</b></span>
      <span>TAPS <b id="moves">0</b></span>
    </div>
  </div>

  <div class="hint" id="hint">Tap the mirrors to bend the beam into the beacon.</div>

  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <div class="ov-title" id="ovTitle">Level Complete</div>
      <div class="ov-sub" id="ovSub"></div>
      <button class="primary" id="ovBtn">Next Level →</button>
    </div>
  </div>

  <div class="controls">
    <button id="resetBtn">↻ Reset</button>
  </div>

</div>

<script>
(() => {
  "use strict";

  /* ============================================================
     LEVEL DATA
     S = light source,  T = beacon/target,  M = rotatable mirror,
     # = solid wall,    . = empty space
     ============================================================ */
  const LEVELS = [
    { dir: 'right', grid: [
      "S.M",
      "...",
      "..T"
    ]},
    { dir: 'right', grid: [
      "S.M..",
      ".....",
      "..M.T",
      ".....",
      "....."
    ]},
    { dir: 'right', grid: [
      "S..M.",
      ".....",
      "T..M.",
      ".....",
      "....."
    ]},
    { dir: 'right', grid: [
      "S.M...",
      "......",
      ".M.M..",
      "......",
      ".T.M..",
      "......"
    ]},
    { dir: 'right', grid: [
      "S....M.",
      ".......",
      ".M...M.",
      ".......",
      ".......",
      ".M..T..",
      "......."
    ]},
    { dir: 'right', grid: [
      "S.....M",
      "...#...",
      ".M....M",
      ".......",
      "...#...",
      ".M..M..",
      "#...T.."
    ]},
    { dir: 'right', grid: [
      "S......M",
      "...#....",
      "..M....M",
      "........",
      "...#....",
      "..M...M.",
      ".#......",
      "...T..M."
    ]},
    { dir: 'right', grid: [
      "S.......M",
      ".....#...",
      ".M......M",
      "......#..",
      "....#....",
      ".M.....M.",
      "....#....",
      "#..M...M.",
      "...T....."
    ]}
  ];

  /* ============================================================
     HELPERS
     ============================================================ */
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };

  const DIRS = {
    right: [1, 0],
    left:  [-1, 0],
    up:    [0, -1],
    down:  [0, 1]
  };

  // mirror reflection tables
  const REFLECT = {
    '/':  { right: 'up',   up: 'right',  left: 'down', down: 'left'  },
    '\\': { right: 'down', down: 'right', left: 'up',  up: 'left'    }
  };

  /* ============================================================
     DOM REFERENCES
     ============================================================ */
  const boardEl = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub   = document.getElementById('ovSub');
  const ovBtn   = document.getElementById('ovBtn');
  const lvlEl   = document.getElementById('lvl');
  const movesEl = document.getElementById('moves');
  const resetBtn= document.getElementById('resetBtn');
  const hintEl  = document.getElementById('hint');

  document.getElementById('maxLvl').textContent = LEVELS.length;

  /* ============================================================
     STATE
     ============================================================ */
  let levelIdx = 0;
  let state = null;
  let svgEl = null;
  let beamGlow = null, beamMid = null, beamCore = null;
  let mirrorEls = new Map();
  let locked = false;
  let totalMoves = 0;

  /* ============================================================
     GEOMETRY
     ============================================================ */
  function arrowPath(cx, cy, dir) {
    const ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[dir] || 0;
    const pts = [[-0.12, -0.13], [0.16, 0], [-0.12, 0.13]];
    const c = Math.cos(ang), s = Math.sin(ang);
    return 'M' + pts.map(([px, py]) => {
      const rx = px * c - py * s;
      const ry = px * s + py * c;
      return `${(cx + rx).toFixed(3)} ${(cy + ry).toFixed(3)}`;
    }).join(' L ') + ' Z';
  }
